<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Master Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Kinetic Flame Gradient (Setlife / DZP) -->
    <linearGradient id="flameKinetic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ff4d1a"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>

    <linearGradient id="flameFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0"/>
    </linearGradient>

    <!-- Halftone Pattern for Classical Shading -->
    <pattern id="halftoneDot" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ff3300" fill-opacity="0.85"/>
    </pattern>

    <pattern id="halftoneFine" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#f5f2eb" fill-opacity="0.5"/>
    </pattern>

    <pattern id="gridFine" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#181c28" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <!-- Keycap Lighting Filter -->
    <filter id="keyBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .extended { font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif; }

    @keyframes flamePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #ff3300); }
    }
    @keyframes keyPress {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(1px); }
    }
    .speed-slice {
      animation: flamePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Base -->
  <rect width="1200" height="450" rx="16" fill="url(#bgDark)"/>
  <rect width="1200" height="450" rx="16" fill="url(#gridFine)"/>
  <rect x="1" y="1" width="1198" height="448" rx="15" fill="none" stroke="#222634" stroke-width="1.2"/>

  <!-- ==================== TOP MARCARDONA INDUSTRIAL TAPE ==================== -->
  <g transform="translate(30, 24)">
    <rect width="1140" height="34" rx="4" fill="#0d1017" stroke="#262b3a" stroke-width="1"/>
    
    <!-- Left Star and Brand Stamp -->
    <path d="M 22 17 L 24 10 L 26 17 L 33 19 L 26 21 L 24 28 L 22 21 L 15 19 Z" fill="#ff3300"/>
    <text x="40" y="22" font-size="10.5" font-weight="800" fill="#f5f2eb" letter-spacing="2" class="mono">
      TRIBUNAL KIT // ARTICLE IV § 12
    </text>
    <text x="290" y="22" font-size="10" font-weight="600" fill="#8a92a3" letter-spacing="1.5" class="mono">
      AI NEUROSYMBOLIC GOVERNANCE ENVELOPE
    </text>

    <!-- Barcode Decal -->
    <g transform="translate(850, 8)">
      <rect x="0" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="4" y="0" width="4" height="18" fill="#d4d8e0"/>
      <rect x="10" y="0" width="1" height="18" fill="#d4d8e0"/>
      <rect x="13" y="0" width="3" height="18" fill="#d4d8e0"/>
      <rect x="18" y="0" width="5" height="18" fill="#d4d8e0"/>
      <rect x="25" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="29" y="0" width="3" height="18" fill="#d4d8e0"/>
      <rect x="34" y="0" width="1" height="18" fill="#d4d8e0"/>
      <rect x="37" y="0" width="4" height="18" fill="#d4d8e0"/>
      <rect x="43" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="47" y="0" width="4" height="18" fill="#d4d8e0"/>
    </g>

    <!-- Right Live Status Tag -->
    <rect x="980" y="6" width="145" height="22" rx="3" fill="#ff3300" fill-opacity="0.15" stroke="#ff3300" stroke-width="0.8"/>
    <circle cx="994" cy="17" r="3.5" fill="#ff3300"/>
    <text x="1005" y="21" font-size="9" font-weight="800" fill="#ff3300" letter-spacing="1" class="mono">
      AST-INTERCEPT &lt;10ms
    </text>
  </g>

  <!-- ==================== LEFT HALFTONE STATUARY (CLASSICAL ROMAN PRAETOR) ==================== -->
  <g transform="translate(60, 90)">
    <!-- Bust Silhouette Frame -->
    <rect width="210" height="230" rx="8" fill="#0d1017" stroke="#252a3a" stroke-width="1.2"/>
    
    <!-- Background Halftone Grid -->
    <rect x="4" y="4" width="202" height="222" rx="6" fill="url(#halftoneFine)"/>

    <!-- Classical Marble Head Profile Vector with Halftone Mask -->
    <!-- Head Base Silhouette -->
    <path d="M 95 30 
             C 125 30, 155 45, 165 75 
             C 170 90, 168 110, 160 125 
             C 152 140, 142 148, 138 165 
             C 134 180, 140 200, 150 215 
             L 55 215 
             C 58 195, 62 175, 60 150 
             C 58 120, 52 95, 62 65 
             C 70 45, 80 30, 95 30 Z" 
          fill="#131722"/>

    <!-- Classical Laurel Wreath and Profile Shading in Vermilion Halftone -->
    <path d="M 85 45 C 105 45, 125 55, 135 75 C 120 70, 100 70, 85 78 Z" fill="#ff3300" fill-opacity="0.8"/>
    <path d="M 130 85 C 145 92, 148 105, 142 118 C 135 110, 132 98, 130 85 Z" fill="#ff3300"/>
    <path d="M 125 125 L 140 135 L 126 142 Z" fill="#ff3300"/> <!-- Classical Roman Nose -->
    <path d="M 122 152 C 130 152, 134 156, 126 160 Z" fill="#ff3300"/> <!-- Lips -->
    <path d="M 126 168 C 135 170, 134 182, 120 185 Z" fill="#ff3300"/> <!-- Strong Jaw -->

    <!-- Classical Drapery Halftone Dots -->
    <circle cx="80" cy="100" r="12" fill="url(#halftoneDot)"/>
    <circle cx="105" cy="130" r="16" fill="url(#halftoneDot)"/>
    <circle cx="85" cy="165" r="22" fill="url(#halftoneDot)"/>
    <circle cx="115" cy="195" r="18" fill="url(#halftoneDot)"/>

    <!-- Roman Justice Blindfold Ribbon / Ast Axis -->
    <rect x="80" y="86" width="76" height="14" rx="2" fill="#ff3300" filter="url(#speedGlow)"/>
    <text x="118" y="97" text-anchor="middle" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="1" class="mono">
      VERITAS
    </text>

    <!-- Foot Label -->
    <rect x="15" y="196" width="90" height="20" rx="3" fill="#06070a" stroke="#252a3a" stroke-width="0.8"/>
    <text x="60" y="210" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f5f2eb" letter-spacing="1" class="mono">
      LEX ANTIQUA
    </text>
  </g>

  <!-- ==================== CENTERPIECE: SETLIFE-STYLE KINETIC TYPOGRAPHY ==================== -->
  <g transform="translate(320, 110)">
    <!-- Category Stamp and 8-point star (Boostio style) -->
    <g transform="translate(0, 14)">
      <path d="M 6 0 L 8 -6 L 10 0 L 16 2 L 10 4 L 8 10 L 6 4 L 0 2 Z" fill="#ff3300"/>
      <text x="24" y="6" font-size="11" font-weight="800" fill="#ff3300" letter-spacing="2.5" class="mono">
        AUTONOMOUS AI CODE GOVERNANCE
      </text>
    </g>

    <!-- Main Title: TRIBUNAL KIT with Kinetic Speed Cutouts -->
    <g transform="translate(0, 90)">
      <!-- Base Crisp Text -->
      <text x="0" y="0" font-size="64" font-weight="900" letter-spacing="4" fill="#f5f2eb" class="extended">
        TRIBUNAL KIT
      </text>

      <!-- Setlife Kinetic Speed Lines Slicing Across Text -->
      <g class="speed-slice">
        <!-- Streak 1 (Across upper crossbar) -->
        <rect x="95" y="-38" width="130" height="6" rx="2" fill="url(#flameKinetic)"/>
        <!-- Streak 2 (Across mid crossbar) -->
        <rect x="250" y="-22" width="220" height="7" rx="2" fill="url(#flameKinetic)"/>
        <!-- Streak 3 (Trailing tail) -->
        <rect x="490" y="-12" width="120" height="5" rx="1.5" fill="url(#flameFade)"/>
      </g>
    </g>

    <!-- Tagline (Demandas / Boostio editorial pairing) -->
    <g transform="translate(0, 132)">
      <text x="0" y="0" font-size="17" font-weight="700" fill="#ffffff" class="sans">
        Your AI writes code that doesn't exist. Tribunal Kit stops it.
      </text>
      <text x="0" y="24" font-size="13" font-weight="500" fill="#8a92a3" letter-spacing="0.5" class="sans">
        Compiled Rust Core &lt;10ms • 52 Specialists • 28 Reviewers • 185 Deep Skills
      </text>
    </g>

    <!-- ==================== DZP HARDWARE MECHANICAL KEYCAPS ROW ==================== -->
    <!-- [P] [R] [O] [C] [E] [S] [S] [O] [S] motif transformed to [T] [R] [I] [B] [U] [N] [A] [L] -->
    <g transform="translate(0, 175)">
      <!-- Keycap Generator Macro: 8 Keys -->
      <!-- Key 1: T -->
      <g transform="translate(0, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">T</text>
      </g>
      <!-- Key 2: R -->
      <g transform="translate(46, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">R</text>
      </g>
      <!-- Key 3: I -->
      <g transform="translate(92, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">I</text>
      </g>
      <!-- Key 4: B -->
      <g transform="translate(138, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">B</text>
      </g>
      <!-- Key 5: U -->
      <g transform="translate(184, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">U</text>
      </g>
      <!-- Key 6: N -->
      <g transform="translate(230, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">N</text>
      </g>
      <!-- Key 7: A -->
      <g transform="translate(276, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">A</text>
      </g>
      <!-- Key 8: L -->
      <g transform="translate(322, 0)" filter="url(#keyBevel)">
        <rect width="40" height="40" rx="6" fill="#141722" stroke="#2c3244" stroke-width="1.2"/>
        <rect x="3" y="3" width="34" height="30" rx="4" fill="#1a1f2e"/>
        <text x="20" y="23" text-anchor="middle" font-size="14" font-weight="800" fill="#f5f2eb" class="mono">L</text>
      </g>

      <!-- Keycap Execution Tag -->
      <g transform="translate(380, 8)">
        <rect width="160" height="26" rx="4" fill="#06070a" stroke="#ff3300" stroke-width="1"/>
        <text x="80" y="17" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ff3300" letter-spacing="1.5" class="mono">
          CORE KERNEL LOADED
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM DECAL TELEMETRY STRIP ==================== -->
  <g transform="translate(30, 375)">
    <!-- Pill 1: 52 Specialists -->
    <g transform="translate(0, 0)">
      <rect width="210" height="46" rx="6" fill="#0d1017" stroke="#252a3a" stroke-width="1"/>
      <path d="M 18 23 L 20 17 L 22 23 L 28 25 L 22 27 L 20 33 L 18 27 L 12 25 Z" fill="#ff3300"/>
      <text x="36" y="22" font-size="11" font-weight="800" fill="#f5f2eb" class="sans">52 SPECIALISTS</text>
      <text x="36" y="36" font-size="9.5" fill="#8a92a3" class="mono">Domain-specific reasoning</text>
    </g>

    <!-- Pill 2: 28 Reviewers -->
    <g transform="translate(232, 0)">
      <rect width="210" height="46" rx="6" fill="#0d1017" stroke="#252a3a" stroke-width="1"/>
      <path d="M 18 23 L 20 17 L 22 23 L 28 25 L 22 27 L 20 33 L 18 27 L 12 25 Z" fill="#ff3300"/>
      <text x="36" y="22" font-size="11" font-weight="800" fill="#f5f2eb" class="sans">28 REVIEWERS</text>
      <text x="36" y="36" font-size="9.5" fill="#8a92a3" class="mono">Parallel zero-trust swarms</text>
    </g>

    <!-- Pill 3: 10ms Rust Core -->
    <g transform="translate(464, 0)">
      <rect width="210" height="46" rx="6" fill="#1a0c0a" stroke="#ff3300" stroke-width="1.2"/>
      <path d="M 18 23 L 20 17 L 22 23 L 28 25 L 22 27 L 20 33 L 18 27 L 12 25 Z" fill="#ff3300"/>
      <text x="36" y="22" font-size="11" font-weight="800" fill="#ff3300" class="sans">&lt;10ms RUST CORE</text>
      <text x="36" y="36" font-size="9.5" fill="#e88367" class="mono">Compiled AOT SHA-256 diff</text>
    </g>

    <!-- Pill 4: 185 Skills -->
    <g transform="translate(696, 0)">
      <rect width="210" height="46" rx="6" fill="#0d1017" stroke="#252a3a" stroke-width="1"/>
      <path d="M 18 23 L 20 17 L 22 23 L 28 25 L 22 27 L 20 33 L 18 27 L 12 25 Z" fill="#ff3300"/>
      <text x="36" y="22" font-size="11" font-weight="800" fill="#f5f2eb" class="sans">185 SKILLS</text>
      <text x="36" y="36" font-size="9.5" fill="#8a92a3" class="mono">Deep procedural packs</text>
    </g>

    <!-- Pill 5: Zero Dependencies -->
    <g transform="translate(928, 0)">
      <rect width="212" height="46" rx="6" fill="#0d1017" stroke="#252a3a" stroke-width="1"/>
      <path d="M 18 23 L 20 17 L 22 23 L 28 25 L 22 27 L 20 33 L 18 27 L 12 25 Z" fill="#ff3300"/>
      <text x="36" y="22" font-size="11" font-weight="800" fill="#f5f2eb" class="sans">0 RUNTIME DEPS</text>
      <text x="36" y="36" font-size="9.5" fill="#8a92a3" class="mono">Pure zero-bloat binary</text>
    </g>
  </g>
</svg>
