<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <!-- Core Background Gradient -->
    <linearGradient id="void-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>

    <!-- Faint Engineered Dot Grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#222634" opacity="0.4" />
    </pattern>

    <!-- Industrial Calibration Ruler (Tape) -->
    <pattern id="calibration-tape" width="120" height="10" patternUnits="userSpaceOnUse">
      <rect width="120" height="10" fill="#0e1117" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#222634" stroke-width="2" />
      <!-- Ticks -->
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff3300" stroke-width="1.5" opacity="0.9" />
      <line x1="12" y1="0" x2="12" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="24" y1="0" x2="24" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="36" y1="0" x2="36" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="48" y1="0" x2="48" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="60" y1="0" x2="60" y2="8" stroke="#ff3300" stroke-width="1.5" opacity="0.7" />
      <line x1="72" y1="0" x2="72" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="84" y1="0" x2="84" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="96" y1="0" x2="96" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="108" y1="0" x2="108" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
    </pattern>

    <!-- Bisected Header Clip Paths -->
    <clipPath id="clip-top">
      <rect x="-20" y="-100" width="800" height="74" />
    </clipPath>
    <clipPath id="clip-bottom">
      <rect x="-20" y="-26" width="800" height="100" />
    </clipPath>

    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typography & Styles -->
    <style>
      .title-text { 
        font-family: 'Inter', -apple-system, sans-serif; 
        font-weight: 900; 
        letter-spacing: -2px; 
        text-transform: uppercase;
      }
      .mono-text { 
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; 
        font-size: 11px; 
        letter-spacing: 2px; 
      }
      .subtitle-text { 
        font-family: 'Inter', -apple-system, sans-serif; 
        font-weight: 700; 
        letter-spacing: 6px; 
      }
      
      /* Asterism Harmonic Core Glow */
      .core-pulse { 
        animation: pulseCore 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
      }
      @keyframes pulseCore { 
        0%, 100% { 
          filter: drop-shadow(0 0 6px rgba(255,51,0,0.35)); 
          transform: scale(1);
        } 
        50% { 
          filter: drop-shadow(0 0 22px rgba(255,51,0,0.85)); 
          transform: scale(1.02);
        } 
      }
      
      /* Harmonic Expanding Radiance Ring */
      .harmonic-radiance {
        animation: radiateRing 4s ease-out infinite;
        transform-origin: 0 0;
      }
      @keyframes radiateRing {
        0% { transform: scale(0.6); opacity: 0.8; }
        80% { transform: scale(1.15); opacity: 0; }
        100% { transform: scale(1.15); opacity: 0; }
      }

      /* Kinetic Header Slice Stream */
      .kinetic-slice { 
        stroke-dasharray: 180 820; 
        animation: sliceTravel 3.2s cubic-bezier(0.19, 1, 0.22, 1) infinite; 
      }
      @keyframes sliceTravel { 
        0% { stroke-dashoffset: 1000; } 
        100% { stroke-dashoffset: -200; } 
      }

      /* Telemetry Diode */
      .diode-beacon {
        animation: diodeBlink 1.8s ease-in-out infinite;
      }
      @keyframes diodeBlink {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.2; }
      }
      
      /* Hardware Bevel */
      .keycap-highlight { fill: #ffffff; opacity: 0.08; }
      .keycap-shadow { fill: #000000; opacity: 0.3; }

      @media (prefers-reduced-motion: reduce) {
        .core-pulse, .harmonic-radiance, .kinetic-slice, .diode-beacon { 
          animation: none !important; 
          filter: none !important; 
          stroke-dasharray: none !important;
          transform: none !important;
        }
        .kinetic-photon {
          display: none !important;
        }
      }
    </style>
  </defs>

  <!-- 1. Background Foundation -->
  <rect width="1000" height="320" fill="url(#void-bg)" />
  <rect width="1000" height="320" fill="url(#dot-grid)" />

  <!-- 2. Structural Borders (Calibration Tape) -->
  <rect x="0" y="0" width="1000" height="10" fill="url(#calibration-tape)" />
  <rect x="0" y="310" width="1000" height="10" fill="url(#calibration-tape)" transform="scale(1, -1) translate(0, -320)" />

  <!-- Inner Framework Line -->
  <rect x="32" y="32" width="936" height="256" fill="none" stroke="#222634" stroke-width="1.5" rx="4" />
  
  <!-- Technical Accents -->
  <path d="M 32 64 L 40 64" stroke="#ff3300" stroke-width="2" />
  <path d="M 32 256 L 40 256" stroke="#ff3300" stroke-width="2" />
  <path d="M 968 64 L 960 64" stroke="#ff3300" stroke-width="2" />
  <path d="M 968 256 L 960 256" stroke="#ff3300" stroke-width="2" />

  <!-- ========================================== -->
  <!-- 3. MAIN MARK: 8-POINT JUDICIAL ASTERISM    -->
  <!-- ========================================== -->
  <g transform="translate(200, 160)">
    
    <!-- Outer Precision Orbit (Rock-solid SMIL Rotation) -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1f232e" stroke-width="1" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ff3300" stroke-width="2" stroke-dasharray="4 24">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner Orbit (Counter-Rotating with High Precision) -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#222634" stroke-width="3" stroke-dasharray="60 15">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Harmonic Radiance Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ff3300" stroke-width="1.2" class="harmonic-radiance"/>

    <!-- Geometric Crosshairs -->
    <line x1="-110" y1="0" x2="-80" y2="0" stroke="#ff3300" stroke-width="1.5" opacity="0.6" />
    <line x1="80" y1="0" x2="110" y2="0" stroke="#ff3300" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="-110" x2="0" y2="-80" stroke="#ff3300" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="80" x2="0" y2="110" stroke="#ff3300" stroke-width="1.5" opacity="0.6" />

    <!-- The Core Asterism -->
    <g class="core-pulse">
      <!-- Base Vermilion Star -->
      <path d="M 0 -68 L 14 -14 L 68 0 L 14 14 L 0 68 L -14 14 L -68 0 L -14 -14 Z" fill="#ff3300" />
      
      <!-- Inner Charcoal Star -->
      <path d="M 0 -50 L 10 -10 L 50 0 L 10 10 L 0 50 L -10 10 L -50 0 L -10 -10 Z" fill="#060709" />
      
      <!-- Brilliant Bone Core -->
      <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z" fill="#f5f2eb" />
      
      <!-- Central Cutout -->
      <circle cx="0" cy="0" r="4" fill="#060709" />
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. TYPOGRAPHY & DATA STRUCTURE             -->
  <!-- ========================================== -->
  <g transform="translate(370, 160)">
    
    <!-- Top Metadata Track with Diode Indicator -->
    <circle cx="-14" cy="-74" r="3" fill="#ff3300" class="diode-beacon"/>
    <text x="0" y="-70" fill="#8a92a3" class="mono-text">ESTD. 2026 // ARTICLE IV § 12 // MINIMAL DEPENDENCIES</text>
    
    <!-- Bisected Kinetic Header -->
    <g>
      <!-- Top Half (Shifted Left) -->
      <text x="-3" y="0" fill="#ffffff" font-size="72" class="title-text" clip-path="url(#clip-top)">TRIBUNAL KIT</text>
      
      <!-- Bottom Half (Shifted Right) -->
      <text x="3" y="0" fill="#ffffff" font-size="72" class="title-text" clip-path="url(#clip-bottom)" opacity="0.95">TRIBUNAL KIT</text>
      
      <!-- Kinetic Speed Line Cutting Through the Axis -->
      <line x1="-50" y1="-26" x2="550" y2="-26" stroke="#222634" stroke-width="1" opacity="0.5" />
      <line x1="-50" y1="-26" x2="550" y2="-26" stroke="#ff3300" stroke-width="3" class="kinetic-slice" />
      
      <!-- Traveling Photon Bead Along the Axis Cut -->
      <g class="kinetic-photon">
        <circle r="3.5" fill="#ffffff" filter="url(#core-glow)">
          <animateMotion path="M -50 -26 L 550 -26" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    
    <!-- Subtitle Track -->
    <text x="3" y="42" fill="#d4d8e0" font-size="18" class="subtitle-text">KINETIC GOVERNANCE LAYER</text>

    <!-- ========================================== -->
    <!-- 5. 3D HARDWARE KEYCAPS (A-S-T)             -->
    <!-- ========================================== -->
    <g transform="translate(0, 75)">
      
      <!-- [A] Keycap -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="40" height="40" rx="6" fill="#0e1117" stroke="#222634" stroke-width="1" />
        <rect x="4" y="2" width="32" height="32" rx="4" fill="#1c1f2a" stroke="#2d3342" stroke-width="1" />
        <path d="M 4 2 L 36 2 L 34 6 L 6 6 Z" class="keycap-highlight" />
        <path d="M 4 34 L 36 34 L 34 30 L 6 30 Z" class="keycap-shadow" />
        <text x="20" y="23" fill="#f5f2eb" class="mono-text" font-size="16" font-weight="bold" text-anchor="middle">A</text>
      </g>

      <!-- [S] Keycap -->
      <g transform="translate(50, 0)">
        <rect x="0" y="0" width="40" height="40" rx="6" fill="#0e1117" stroke="#222634" stroke-width="1" />
        <rect x="4" y="2" width="32" height="32" rx="4" fill="#1c1f2a" stroke="#2d3342" stroke-width="1" />
        <path d="M 4 2 L 36 2 L 34 6 L 6 6 Z" class="keycap-highlight" />
        <path d="M 4 34 L 36 34 L 34 30 L 6 30 Z" class="keycap-shadow" />
        <text x="20" y="23" fill="#f5f2eb" class="mono-text" font-size="16" font-weight="bold" text-anchor="middle">S</text>
      </g>

      <!-- [T] Keycap -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="40" height="40" rx="6" fill="#0e1117" stroke="#222634" stroke-width="1" />
        <rect x="4" y="2" width="32" height="32" rx="4" fill="#1c1f2a" stroke="#2d3342" stroke-width="1" />
        <path d="M 4 2 L 36 2 L 34 6 L 6 6 Z" class="keycap-highlight" />
        <path d="M 4 34 L 36 34 L 34 30 L 6 30 Z" class="keycap-shadow" />
        <text x="20" y="23" fill="#f5f2eb" class="mono-text" font-size="16" font-weight="bold" text-anchor="middle">T</text>
      </g>

      <!-- Industrial Label / Verification Status with Radar Ping -->
      <g transform="translate(160, 8)">
        <rect x="0" y="0" width="115" height="24" rx="2" fill="#ff3300" opacity="0.1" />
        <rect x="0" y="0" width="115" height="24" rx="2" fill="none" stroke="#ff3300" stroke-width="1" />
        
        <!-- Animated Sonar Ping Ring -->
        <circle cx="12" cy="12" r="4" fill="none" stroke="#ff3300" stroke-width="1">
          <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite" />
        </circle>

        <!-- Core Diode -->
        <circle cx="12" cy="12" r="3.5" fill="#ff3300" class="diode-beacon" />
        
        <text x="26" y="16" fill="#ff4d1a" class="mono-text" font-weight="bold">VERIFIED_9</text>
      </g>
    </g>
  </g>
</svg>
