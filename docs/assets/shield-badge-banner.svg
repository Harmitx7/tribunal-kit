<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Master Background -->
    <linearGradient id="tapeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Halftone for Banner -->
    <pattern id="shieldDots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff3300"/>
    </pattern>

    <filter id="tapeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: 0.5px; }
    .subtitle-text { font-family: 'Inter', sans-serif; }
    .mono-text { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; letter-spacing: 1px; }
  </style>

  <!-- Base Decal Body -->
  <rect width="800" height="150" rx="4" fill="url(#tapeBg)"/>
  <rect x="1" y="1" width="798" height="148" rx="4" fill="none" stroke="#222634" stroke-width="1.2"/>

  <!-- Left Accent Vermilion Block -->
  <rect x="0" y="0" width="8" height="150" rx="2" fill="#ff3300"/>

  <!-- Left Circular Seal Stamp -->
  <g transform="translate(60, 75)" filter="url(#tapeShadow)">
    <circle cx="0" cy="0" r="34" fill="#0b0e14" stroke="#ff3300" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#222634" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- 8-Point Asterism Mini -->
    <g transform="translate(0, -6) scale(0.18)">
      <path d="M 0 -68 L 14 -14 L 68 0 L 14 14 L 0 68 L -14 14 L -68 0 L -14 -14 Z" fill="#ff3300" />
      <path d="M 0 -50 L 10 -10 L 50 0 L 10 10 L 0 50 L -10 10 L -50 0 L -10 -10 Z" fill="#060709" />
      <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z" fill="#f5f2eb" />
    </g>

    <!-- Micro Stamp Ring -->
    <text x="0" y="22" text-anchor="middle" font-size="6.5" font-weight="900" fill="#f5f2eb" class="mono-text">VERITAS</text>
  </g>

  <!-- Center Content -->
  <g transform="translate(120, 36)">
    <!-- Top Meta Label -->
    <text x="0" y="0" font-size="9" font-weight="900" fill="#ff3300" class="mono-text">
      AI SUPPLY CHAIN SECURITY SEAL // ARTICLE IV
    </text>

    <!-- Title -->
    <text x="0" y="28" font-size="22" fill="#f5f2eb" class="title-text">
      Protected by Tribunal Kit
    </text>

    <!-- Subtitle -->
    <text x="0" y="48" font-size="11" fill="#8a92a3" class="subtitle-text">
      Zero hallucinated packages • 28 parallel reviewer gates • Pre-push verified
    </text>

    <!-- Architectural Progression Strip -->
    <g transform="translate(0, 62)">
      <!-- Target Rings instead of weird shields -->
      <g transform="translate(8, 12)">
        <circle cx="0" cy="0" r="8" fill="#ff3300"/>
      </g>
      <line x1="16" y1="12" x2="26" y2="12" stroke="#222634" stroke-width="1.5" />
      
      <g transform="translate(34, 12)">
        <circle cx="0" cy="0" r="8" fill="url(#shieldDots)"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#ff3300" stroke-width="1.5"/>
      </g>
      <line x1="42" y1="12" x2="52" y2="12" stroke="#222634" stroke-width="1.5" />

      <g transform="translate(60, 12)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#ff3300" stroke-width="2"/>
      </g>
      <line x1="68" y1="12" x2="78" y2="12" stroke="#222634" stroke-width="1.5" />

      <g transform="translate(86, 12)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#8a92a3" stroke-width="1.5" stroke-dasharray="2 2"/>
      </g>
      <line x1="94" y1="12" x2="104" y2="12" stroke="#222634" stroke-width="1.5" />

      <g transform="translate(112, 12)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#8a92a3" stroke-width="1"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#8a92a3" stroke-width="1"/>
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#8a92a3" stroke-width="1"/>
      </g>

      <!-- Label below strip -->
      <text x="134" y="15" font-size="9" font-weight="800" fill="#ff3300" class="mono-text">
        AST-HASH STATE: REPRODUCIBLE INVARIANT
      </text>
    </g>
  </g>

  <!-- Right Interactive Verification Badge Preview Box -->
  <g transform="translate(560, 42)" filter="url(#tapeShadow)">
    <rect width="210" height="66" rx="4" fill="#0b0e14" stroke="#222634" stroke-width="1"/>
    
    <!-- Top mini header -->
    <rect width="210" height="20" rx="4" fill="#131620"/>
    <rect y="12" width="210" height="8" fill="#131620"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="#222634" stroke-width="1"/>
    <text x="10" y="14" font-size="8" font-weight="900" fill="#8a92a3" class="mono-text">EMBED DECAL</text>
    <circle cx="196" cy="10" r="3" fill="#ff3300"/>

    <!-- Dual Badge Preview Pill -->
    <g transform="translate(10, 30)">
      <rect width="95" height="26" rx="3" fill="#060709" stroke="#222634" stroke-width="1"/>
      <path d="M 12 13 L 13 9 L 14 13 L 18 14 L 14 15 L 13 19 L 12 15 L 8 14 Z" fill="#ff3300"/>
      <text x="24" y="17" font-size="9" font-weight="900" fill="#f5f2eb" class="mono-text">PROTECTED</text>

      <rect x="95" width="95" height="26" rx="3" fill="#ff3300"/>
      <text x="142" y="17" text-anchor="middle" font-size="9" font-weight="900" fill="#ffffff" class="mono-text">TRIBUNAL</text>
    </g>
  </g>
</svg>
