<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Master Background -->
    <linearGradient id="void-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>

    <!-- Faint Engineered Dot Grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#222634" opacity="0.4" />
    </pattern>

    <!-- Industrial Calibration Tape -->
    <pattern id="calibration-tape" width="120" height="10" patternUnits="userSpaceOnUse">
      <rect width="120" height="10" fill="#0e1117" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#222634" stroke-width="2" />
      <!-- Ticks -->
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff3300" stroke-width="1.5" opacity="0.9" />
      <line x1="12" y1="0" x2="12" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="24" y1="0" x2="24" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="36" y1="0" x2="36" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="48" y1="0" x2="48" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="60" y1="0" x2="60" y2="8" stroke="#ff3300" stroke-width="1.5" opacity="0.7" />
      <line x1="72" y1="0" x2="72" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="84" y1="0" x2="84" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="96" y1="0" x2="96" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
      <line x1="108" y1="0" x2="108" y2="4" stroke="#8a92a3" stroke-width="1" opacity="0.5" />
    </pattern>

    <!-- Node Shadows & Effects -->
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: 2px; }
    .subtitle-text { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 1px; }
    .body-text { font-family: 'Inter', sans-serif; font-weight: 500; }
    .mono-text { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 11px; letter-spacing: 1.5px; }
    
    @keyframes wireFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes wireFlowReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }
    .flow-wire {
      stroke-dasharray: 8 8;
      animation: wireFlow 1s linear infinite;
    }
    .flow-wire-reverse {
      stroke-dasharray: 8 8;
      animation: wireFlowReverse 1s linear infinite;
    }

    .keycap-highlight { fill: #ffffff; opacity: 0.08; }
    .keycap-shadow { fill: #000000; opacity: 0.3; }

    @media (prefers-reduced-motion: reduce) {
      .flow-wire, .flow-wire-reverse { animation: none !important; stroke-dasharray: none !important; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="520" fill="url(#void-bg)"/>
  <rect width="1200" height="520" fill="url(#dot-grid)"/>

  <!-- Top & Bottom Tape Borders -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#calibration-tape)" />
  <rect x="0" y="510" width="1200" height="10" fill="url(#calibration-tape)" transform="scale(1, -1) translate(0, -520)" />

  <!-- Inner Frame -->
  <rect x="24" y="24" width="1152" height="472" fill="none" stroke="#222634" stroke-width="1.5" rx="4" />

  <!-- ==================== HEADER STRIP ==================== -->
  <g transform="translate(48, 48)">
    <rect width="1104" height="40" rx="4" fill="#0d1017" stroke="#262b3a" stroke-width="1"/>
    
    <!-- 8-Point Asterism Mini -->
    <g transform="translate(24, 20) scale(0.25)">
      <path d="M 0 -68 L 14 -14 L 68 0 L 14 14 L 0 68 L -14 14 L -68 0 L -14 -14 Z" fill="#ff3300" />
      <path d="M 0 -50 L 10 -10 L 50 0 L 10 10 L 0 50 L -10 10 L -50 0 L -10 -10 Z" fill="#060709" />
      <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z" fill="#f5f2eb" />
    </g>

    <text x="56" y="24" font-size="13" fill="#f5f2eb" class="title-text">TRIBUNAL PIPELINE ARCHITECTURE</text>
    <text x="360" y="24" font-size="11" fill="#8a92a3" class="mono-text">// 5-STAGE ZERO-TRUST VERIFICATION CONVEYOR</text>

    <!-- Barcode Deco Right -->
    <g transform="translate(980, 10)">
      <rect x="0" y="0" width="2" height="20" fill="#222634"/>
      <rect x="6" y="0" width="4" height="20" fill="#222634"/>
      <rect x="14" y="0" width="2" height="20" fill="#222634"/>
      <rect x="20" y="0" width="1" height="20" fill="#222634"/>
      <rect x="25" y="0" width="6" height="20" fill="#222634"/>
      <rect x="35" y="0" width="3" height="20" fill="#ff3300" opacity="0.8"/>
      <rect x="42" y="0" width="8" height="20" fill="#222634"/>
      <rect x="54" y="0" width="2" height="20" fill="#222634"/>
      <rect x="60" y="0" width="4" height="20" fill="#222634"/>
      <rect x="68" y="0" width="1" height="20" fill="#ff3300" opacity="0.8"/>
      <rect x="73" y="0" width="5" height="20" fill="#222634"/>
      <rect x="82" y="0" width="3" height="20" fill="#222634"/>
      <rect x="89" y="0" width="2" height="20" fill="#222634"/>
    </g>
  </g>

  <!-- ==================== CONDUIT WIRES (DATA BUS) ==================== -->
  <!-- Horizontal Links -->
  <line x1="208" y1="230" x2="278" y2="230" stroke="#ff3300" stroke-width="2.5" class="flow-wire"/>
  <line x1="458" y1="230" x2="528" y2="230" stroke="#ff3300" stroke-width="2.5" class="flow-wire"/>
  <line x1="708" y1="230" x2="778" y2="230" stroke="#ff3300" stroke-width="2.5" class="flow-wire"/>
  <line x1="998" y1="230" x2="1058" y2="230" stroke="#ff3300" stroke-width="2.5" class="flow-wire"/>

  <!-- Inner Loop Re-Prompt Wire (Feedback) -->
  <path d="M 888 380 L 888 450 L 138 450 L 138 310" fill="none" stroke="#ff3300" stroke-width="2" class="flow-wire-reverse"/>
  <rect x="360" y="438" width="380" height="24" rx="4" fill="#1f0907" stroke="#ff3300" stroke-width="1"/>
  <text x="550" y="454" text-anchor="middle" fill="#ff4d1a" class="mono-text" font-weight="bold">
    ⚡ INNER-LOOP AUTO-CORRECT: RE-PROMPT AGENT WITH LIVE EVIDENCE
  </text>

  <!-- ==================== STAGE 01: AGENT INTENT ==================== -->
  <g transform="translate(48, 150)" filter="url(#node-shadow)">
    <rect width="160" height="160" rx="6" fill="#0b0e14" stroke="#222634" stroke-width="1.5"/>
    <rect width="160" height="32" rx="6" fill="#161924"/>
    <rect y="26" width="160" height="6" fill="#161924"/> <!-- hide bottom corners -->
    <text x="80" y="21" text-anchor="middle" fill="#f5f2eb" font-weight="900" class="mono-text">STAGE 01</text>

    <!-- 3D Keycaps [A] [G] [T] -->
    <g transform="translate(24, 48)">
      <!-- A -->
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#0e1117" stroke="#222634" stroke-width="1"/>
      <rect x="3" y="2" width="26" height="26" rx="3" fill="#1c1f2a" stroke="#2d3342" stroke-width="1"/>
      <path d="M 3 2 L 29 2 L 27 6 L 5 6 Z" class="keycap-highlight" />
      <path d="M 3 28 L 29 28 L 27 24 L 5 24 Z" class="keycap-shadow" />
      <text x="16" y="20" fill="#ff3300" font-weight="bold" font-size="14" class="mono-text" text-anchor="middle">A</text>
      
      <!-- G -->
      <rect x="40" y="0" width="32" height="32" rx="4" fill="#0e1117" stroke="#222634" stroke-width="1"/>
      <rect x="43" y="2" width="26" height="26" rx="3" fill="#1c1f2a" stroke="#2d3342" stroke-width="1"/>
      <path d="M 43 2 L 69 2 L 67 6 L 45 6 Z" class="keycap-highlight" />
      <path d="M 43 28 L 69 28 L 67 24 L 45 24 Z" class="keycap-shadow" />
      <text x="56" y="20" fill="#ff3300" font-weight="bold" font-size="14" class="mono-text" text-anchor="middle">G</text>
      
      <!-- T -->
      <rect x="80" y="0" width="32" height="32" rx="4" fill="#0e1117" stroke="#222634" stroke-width="1"/>
      <rect x="83" y="2" width="26" height="26" rx="3" fill="#1c1f2a" stroke="#2d3342" stroke-width="1"/>
      <path d="M 83 2 L 109 2 L 107 6 L 85 6 Z" class="keycap-highlight" />
      <path d="M 83 28 L 109 28 L 107 24 L 85 24 Z" class="keycap-shadow" />
      <text x="96" y="20" fill="#ff3300" font-weight="bold" font-size="14" class="mono-text" text-anchor="middle">T</text>
    </g>

    <text x="80" y="106" text-anchor="middle" font-size="14" fill="#f5f2eb" class="subtitle-text">AI Coding Agent</text>
    <text x="80" y="122" text-anchor="middle" font-size="10" fill="#8a92a3" class="mono-text">Cursor / Claude</text>
    
    <rect x="25" y="134" width="110" height="16" rx="2" fill="#ff3300" fill-opacity="0.1" stroke="#ff3300" stroke-width="1"/>
    <text x="80" y="145" text-anchor="middle" font-size="9" fill="#ff4d1a" font-weight="bold" class="mono-text">RAW CODE STREAM</text>
  </g>

  <!-- ==================== STAGE 02: AST CONTEXT BROKER ==================== -->
  <g transform="translate(278, 130)" filter="url(#node-shadow)">
    <rect width="180" height="200" rx="6" fill="#0b0e14" stroke="#222634" stroke-width="1.5"/>
    <rect width="180" height="32" rx="6" fill="#161924"/>
    <rect y="26" width="180" height="6" fill="#161924"/>
    <text x="90" y="21" text-anchor="middle" fill="#f5f2eb" font-weight="900" class="mono-text">STAGE 02 // BROKER</text>

    <text x="90" y="60" text-anchor="middle" font-size="15" fill="#f5f2eb" class="subtitle-text">Context Broker</text>
    <line x1="20" y1="72" x2="160" y2="72" stroke="#222634" stroke-width="1"/>

    <!-- Swiss Metadata Checklist -->
    <text x="24" y="94" font-size="11" fill="#a4adc4" class="mono-text">📂 Live Workspace</text>
    <text x="24" y="114" font-size="11" fill="#a4adc4" class="mono-text">📦 Pkg Dependencies</text>
    <text x="24" y="134" font-size="11" fill="#a4adc4" class="mono-text">⚖️ Precedent Index</text>
    <text x="24" y="154" font-size="11" fill="#a4adc4" class="mono-text">📜 Covenant Rules</text>

    <rect x="20" y="168" width="140" height="20" rx="3" fill="#1c1f2a" stroke="#222634" stroke-width="1"/>
    <text x="90" y="182" text-anchor="middle" font-size="10" fill="#d4d8e0" font-weight="bold" class="mono-text">GROUND TRUTH INGEST</text>
  </g>

  <!-- ==================== STAGE 03: COMPILED RUST CORE ==================== -->
  <g transform="translate(528, 120)" filter="url(#node-shadow)">
    <rect width="180" height="220" rx="6" fill="#120706" stroke="#ff3300" stroke-width="1.5"/>
    <rect width="180" height="32" rx="6" fill="#2d120d"/>
    <rect y="26" width="180" height="6" fill="#2d120d"/>
    <text x="90" y="21" text-anchor="middle" fill="#ff3300" font-weight="900" class="mono-text">STAGE 03 // CORE</text>

    <text x="90" y="64" text-anchor="middle" font-size="18">🦀</text>
    <text x="90" y="86" text-anchor="middle" font-size="16" fill="#f5f2eb" class="title-text">tribunal-core</text>
    <text x="90" y="102" text-anchor="middle" font-size="9" fill="#ff3300" font-weight="bold" class="mono-text">NATIVE COMPILED BINARY</text>
    <line x1="20" y1="114" x2="160" y2="114" stroke="#4a1c12" stroke-width="1"/>

    <text x="24" y="136" font-size="11" fill="#f5f2eb" class="mono-text">⚡ SHA-256 Diff</text>
    <text x="24" y="156" font-size="11" fill="#f5f2eb" class="mono-text">🧬 Levenshtein Dedup</text>
    <text x="24" y="176" font-size="11" fill="#f5f2eb" class="mono-text">🛡️ Slopsquat Scan</text>

    <rect x="20" y="190" width="140" height="20" rx="3" fill="#ff3300" fill-opacity="0.2"/>
    <text x="90" y="204" text-anchor="middle" font-size="10" fill="#ff3300" font-weight="bold" class="mono-text">LATENCY &lt; 10ms</text>
  </g>

  <!-- ==================== STAGE 04: PARALLEL REVIEWER SWARM ==================== -->
  <g transform="translate(778, 90)" filter="url(#node-shadow)">
    <rect width="220" height="280" rx="6" fill="#0b0e14" stroke="#ff3300" stroke-width="1.5"/>
    <rect width="220" height="32" rx="6" fill="#1c0a0c"/>
    <rect y="26" width="220" height="6" fill="#1c0a0c"/>
    <text x="110" y="21" text-anchor="middle" fill="#ff4d1a" font-weight="900" class="mono-text">STAGE 04 // 28 REVIEWERS</text>

    <text x="110" y="58" text-anchor="middle" font-size="16" fill="#f5f2eb" class="title-text">REVIEWER SWARM</text>
    <text x="110" y="74" text-anchor="middle" font-size="9" fill="#ff3300" font-weight="bold" class="mono-text">ZERO-TRUST VERIFICATION</text>

    <!-- Reviewer Decal Strips -->
    <g transform="translate(16, 90)">
      <!-- Strip 1: Logic -->
      <rect width="188" height="26" rx="3" fill="#131620" stroke="#222634" stroke-width="1"/>
      <rect x="8" y="8" width="10" height="10" fill="#ff3300" />
      <text x="26" y="17" fill="#f5f2eb" class="mono-text" font-weight="bold">logic-reviewer</text>
      <text x="180" y="17" text-anchor="end" fill="#8a92a3" font-size="9" class="mono-text">AST</text>

      <!-- Strip 2: Security -->
      <g transform="translate(0, 32)">
        <rect width="188" height="26" rx="3" fill="#131620" stroke="#222634" stroke-width="1"/>
        <rect x="8" y="8" width="10" height="10" fill="url(#dot-grid)" />
        <rect x="8" y="8" width="10" height="10" fill="none" stroke="#ff3300" stroke-width="1" />
        <text x="26" y="17" fill="#f5f2eb" class="mono-text" font-weight="bold">security-auditor</text>
        <text x="180" y="17" text-anchor="end" fill="#ff4d1a" font-size="9" class="mono-text">OWASP</text>
      </g>

      <!-- Strip 3: Precedence -->
      <g transform="translate(0, 64)">
        <rect width="188" height="26" rx="3" fill="#131620" stroke="#ff3300" stroke-width="1"/>
        <rect x="8" y="8" width="10" height="10" fill="none" stroke="#ff3300" stroke-width="2" />
        <text x="26" y="17" fill="#f5f2eb" class="mono-text" font-weight="bold">precedence-reviewer</text>
        <text x="180" y="17" text-anchor="end" fill="#ff3300" font-size="9" class="mono-text">CASES</text>
      </g>

      <!-- Strip 4: Schema -->
      <g transform="translate(0, 96)">
        <rect width="188" height="26" rx="3" fill="#131620" stroke="#222634" stroke-width="1"/>
        <rect x="8" y="8" width="10" height="10" fill="none" stroke="#8a92a3" stroke-width="1.5" stroke-dasharray="2 2" />
        <text x="26" y="17" fill="#f5f2eb" class="mono-text" font-weight="bold">schema-reviewer</text>
        <text x="180" y="17" text-anchor="end" fill="#8a92a3" font-size="9" class="mono-text">SQL</text>
      </g>

      <!-- Strip 5: Resilience -->
      <g transform="translate(0, 128)">
        <rect width="188" height="26" rx="3" fill="#131620" stroke="#222634" stroke-width="1"/>
        <rect x="8" y="8" width="10" height="10" fill="none" stroke="#ff3300" stroke-width="1" />
        <text x="26" y="17" fill="#f5f2eb" class="mono-text" font-weight="bold">resilience-reviewer</text>
        <text x="180" y="17" text-anchor="end" fill="#8a92a3" font-size="9" class="mono-text">ASYNC</text>
      </g>
    </g>

    <rect x="16" y="248" width="188" height="22" rx="3" fill="#ff3300" fill-opacity="0.1" stroke="#ff3300" stroke-width="1"/>
    <text x="110" y="262" text-anchor="middle" font-size="10" fill="#ff4d1a" font-weight="900" class="mono-text">ALL 28 GATES MUST PASS</text>
  </g>

  <!-- ==================== STAGE 05: HUMAN GATE (COMMIT) ==================== -->
  <g transform="translate(1058, 130)" filter="url(#node-shadow)">
    <rect width="120" height="200" rx="6" fill="#0b0e14" stroke="#222634" stroke-width="1.5"/>
    <rect width="120" height="32" rx="6" fill="#161924"/>
    <rect y="26" width="120" height="6" fill="#161924"/>
    <text x="60" y="21" text-anchor="middle" fill="#f5f2eb" font-weight="900" class="mono-text">STAGE 05</text>

    <!-- 3D Keycaps [O] [K] -->
    <g transform="translate(24, 52)">
      <!-- O -->
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#0e1117" stroke="#222634" stroke-width="1"/>
      <rect x="3" y="2" width="26" height="26" rx="3" fill="#1c1f2a" stroke="#2d3342" stroke-width="1"/>
      <path d="M 3 2 L 29 2 L 27 6 L 5 6 Z" class="keycap-highlight" />
      <path d="M 3 28 L 29 28 L 27 24 L 5 24 Z" class="keycap-shadow" />
      <text x="16" y="20" fill="#f5f2eb" font-weight="bold" font-size="14" class="mono-text" text-anchor="middle">O</text>
      
      <!-- K -->
      <rect x="40" y="0" width="32" height="32" rx="4" fill="#0e1117" stroke="#222634" stroke-width="1"/>
      <rect x="43" y="2" width="26" height="26" rx="3" fill="#1c1f2a" stroke="#2d3342" stroke-width="1"/>
      <path d="M 43 2 L 69 2 L 67 6 L 45 6 Z" class="keycap-highlight" />
      <path d="M 43 28 L 69 28 L 67 24 L 45 24 Z" class="keycap-shadow" />
      <text x="56" y="20" fill="#f5f2eb" font-weight="bold" font-size="14" class="mono-text" text-anchor="middle">K</text>
    </g>

    <text x="60" y="106" text-anchor="middle" font-size="13" fill="#f5f2eb" class="subtitle-text">Human Gate</text>
    <text x="60" y="122" text-anchor="middle" font-size="10" fill="#8a92a3" class="mono-text">Manual Approval</text>
    <line x1="16" y1="134" x2="104" y2="134" stroke="#222634" stroke-width="1"/>

    <text x="60" y="152" text-anchor="middle" font-size="11" fill="#f5f2eb" font-weight="bold" class="mono-text">SAFE COMMIT</text>
    <text x="60" y="168" text-anchor="middle" font-size="9" fill="#8a92a3" class="mono-text">Atomic Disk Write</text>

    <rect x="12" y="178" width="96" height="16" rx="2" fill="#f5f2eb"/>
    <text x="60" y="189" text-anchor="middle" font-size="9" fill="#060709" font-weight="900" class="mono-text">100% SHIPPED</text>
  </g>
</svg>
