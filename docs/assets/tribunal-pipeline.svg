<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Master Background -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <linearGradient id="nodeFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240e0c"/>
      <stop offset="100%" stop-color="#120706"/>
    </linearGradient>

    <linearGradient id="nodePass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182414"/>
      <stop offset="100%" stop-color="#0c140a"/>
    </linearGradient>

    <!-- Halftone for Pipeline -->
    <pattern id="pipeDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#ff3300" fill-opacity="0.3"/>
    </pattern>

    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="pGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#181c28" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .extended { font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif; }

    @keyframes wireFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-wire {
      stroke-dasharray: 6 6;
      animation: wireFlow 1.8s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="16" fill="url(#pipeBg)"/>
  <rect width="1200" height="520" rx="16" fill="url(#pGrid)"/>
  <rect width="1198" height="518" x="1" y="1" rx="15" fill="none" stroke="#222634" stroke-width="1.2"/>

  <!-- Top MarCardona Inspection Decal Header -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="34" rx="4" fill="#0d1017" stroke="#262b3a" stroke-width="1"/>
    <!-- 8-Point Asterism -->
    <path d="M 20 17 L 22 10 L 24 17 L 31 19 L 24 21 L 22 28 L 20 21 L 13 19 Z" fill="#ff3300"/>
    <text x="38" y="22" font-size="11" font-weight="900" fill="#f5f2eb" letter-spacing="1.5" class="mono">
      TRIBUNAL PIPELINE ARCHITECTURE
    </text>
    <text x="320" y="22" font-size="10" font-weight="600" fill="#8a92a3" letter-spacing="1" class="mono">
      // 5-STAGE ZERO-TRUST VERIFICATION CONVEYOR (LATENCY BUDGET: &lt;15ms)
    </text>

    <!-- Barcode Strip Right -->
    <g transform="translate(980, 8)">
      <rect x="0" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="4" y="0" width="3" height="18" fill="#d4d8e0"/>
      <rect x="9" y="0" width="1" height="18" fill="#d4d8e0"/>
      <rect x="12" y="0" width="5" height="18" fill="#d4d8e0"/>
      <rect x="19" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="23" y="0" width="4" height="18" fill="#d4d8e0"/>
      <rect x="29" y="0" width="2" height="18" fill="#d4d8e0"/>
      <rect x="33" y="0" width="6" height="18" fill="#d4d8e0"/>
      <rect x="41" y="0" width="3" height="18" fill="#d4d8e0"/>
      <rect x="46" y="0" width="1" height="18" fill="#d4d8e0"/>
      <rect x="49" y="0" width="4" height="18" fill="#d4d8e0"/>
      <rect x="55" y="0" width="2" height="18" fill="#d4d8e0"/>
    </g>
  </g>

  <!-- ==================== CONDUIT WIRES ==================== -->
  <line x1="190" y1="225" x2="260" y2="225" stroke="#ff3300" stroke-width="2" class="flow-wire"/>
  <line x1="440" y1="225" x2="510" y2="225" stroke="#ff3300" stroke-width="2" class="flow-wire"/>
  <line x1="690" y1="225" x2="760" y2="225" stroke="#ff3300" stroke-width="2" class="flow-wire"/>
  <line x1="980" y1="225" x2="1040" y2="225" stroke="#ff3300" stroke-width="2" class="flow-wire"/>

  <!-- Inner Loop Re-Prompt Wire (Back to Agent) -->
  <path d="M 870 375 
           L 870 455 
           L 115 455 
           L 115 295" 
        fill="none" 
        stroke="#ff3300" 
        stroke-width="2" 
        class="flow-wire"/>
  <rect x="380" y="442" width="330" height="26" rx="4" fill="#200a0e" stroke="#ff3300" stroke-width="1"/>
  <text x="545" y="459" text-anchor="middle" font-size="10" font-weight="900" fill="#ff4d6a" letter-spacing="1" class="mono">
    ⚡ INNER-LOOP AUTO-CORRECT: RE-PROMPT AGENT WITH LIVE AST EVIDENCE
  </text>

  <!-- ==================== STAGE 01: AGENT INTENT ==================== -->
  <g transform="translate(40, 155)" filter="url(#pShadow)">
    <rect width="150" height="140" rx="8" fill="url(#nodeDark)" stroke="#262b3a" stroke-width="1.2"/>
    <rect width="150" height="26" rx="8" fill="#181c28"/>
    <rect y="16" width="150" height="10" fill="#181c28"/>
    <text x="75" y="18" text-anchor="middle" font-size="9.5" font-weight="900" fill="#f5f2eb" class="mono">STAGE 01</text>

    <!-- Keycap Glyphs [A] [G] [T] -->
    <g transform="translate(25, 45)">
      <rect width="30" height="30" rx="4" fill="#0d1017" stroke="#2a3042" stroke-width="1"/>
      <text x="15" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#ff3300" class="mono">A</text>
      <rect x="35" y="0" width="30" height="30" rx="4" fill="#0d1017" stroke="#2a3042" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#ff3300" class="mono">G</text>
      <rect x="70" y="0" width="30" height="30" rx="4" fill="#0d1017" stroke="#2a3042" stroke-width="1"/>
      <text x="85" y="20" text-anchor="middle" font-size="11" font-weight="800" fill="#ff3300" class="mono">T</text>
    </g>

    <text x="75" y="98" text-anchor="middle" font-size="12.5" font-weight="800" fill="#f5f2eb" class="sans">AI Coding Agent</text>
    <text x="75" y="114" text-anchor="middle" font-size="9" fill="#8a92a3" class="mono">Cursor / Claude / Cline</text>
    <rect x="25" y="122" width="100" height="12" rx="2" fill="#ff3300" fill-opacity="0.2"/>
    <text x="75" y="131" text-anchor="middle" font-size="8" font-weight="800" fill="#ff3300" class="mono">RAW CODE STREAM</text>
  </g>

  <!-- ==================== STAGE 02: AST CONTEXT BROKER ==================== -->
  <g transform="translate(260, 135)" filter="url(#pShadow)">
    <rect width="180" height="180" rx="8" fill="url(#nodeDark)" stroke="#262b3a" stroke-width="1.2"/>
    <rect width="180" height="26" rx="8" fill="#181c28"/>
    <rect y="16" width="180" height="10" fill="#181c28"/>
    <text x="90" y="18" text-anchor="middle" font-size="9.5" font-weight="900" fill="#f5f2eb" class="mono">STAGE 02 // BROKER</text>

    <text x="90" y="52" text-anchor="middle" font-size="13" font-weight="800" fill="#f5f2eb" class="sans">Context Broker</text>
    <line x1="20" y1="62" x2="160" y2="62" stroke="#252b3a" stroke-width="1"/>

    <!-- Swiss Metadata Checklist -->
    <text x="24" y="84" font-size="9.5" fill="#a4adc4" class="mono">📂 Live Workspace AST</text>
    <text x="24" y="104" font-size="9.5" fill="#a4adc4" class="mono">📦 package.json Deps</text>
    <text x="24" y="124" font-size="9.5" fill="#a4adc4" class="mono">⚖️ Precedent Index</text>
    <text x="24" y="144" font-size="9.5" fill="#a4adc4" class="mono">📜 Covenant Rules</text>

    <rect x="20" y="154" width="140" height="18" rx="3" fill="#0e131d" stroke="#262b3a" stroke-width="0.8"/>
    <text x="90" y="166" text-anchor="middle" font-size="8.5" font-weight="800" fill="#d4d8e0" class="mono">GROUND TRUTH INGEST</text>
  </g>

  <!-- ==================== STAGE 03: COMPILED RUST CORE ==================== -->
  <g transform="translate(510, 125)" filter="url(#pShadow)">
    <rect width="180" height="200" rx="8" fill="url(#nodeFlame)" stroke="#ff3300" stroke-width="1.5"/>
    <rect width="180" height="26" rx="8" fill="#2d120d"/>
    <rect y="16" width="180" height="10" fill="#2d120d"/>
    <text x="90" y="18" text-anchor="middle" font-size="9.5" font-weight="900" fill="#ff3300" class="mono">STAGE 03 // RUST CORE</text>

    <text x="90" y="52" text-anchor="middle" font-size="14">🦀</text>
    <text x="90" y="74" text-anchor="middle" font-size="13" font-weight="900" fill="#f5f2eb" class="extended">tribunal-core</text>
    <text x="90" y="88" text-anchor="middle" font-size="8.5" font-weight="800" fill="#ff3300" class="mono">NATIVE COMPILED BINARY</text>
    <line x1="20" y1="98" x2="160" y2="98" stroke="#4a1c12" stroke-width="1"/>

    <text x="24" y="118" font-size="9" fill="#f5f2eb" class="mono">⚡ SHA-256 Hash Diff</text>
    <text x="24" y="136" font-size="9" fill="#f5f2eb" class="mono">🧬 Levenshtein Dedup</text>
    <text x="24" y="154" font-size="9" fill="#f5f2eb" class="mono">🛡️ Slopsquatting Scan</text>

    <rect x="20" y="168" width="140" height="22" rx="3" fill="#ff3300" fill-opacity="0.25"/>
    <text x="90" y="182" text-anchor="middle" font-size="9.5" font-weight="900" fill="#ff3300" class="mono">LATENCY &lt; 10ms</text>
  </g>

  <!-- ==================== STAGE 04: PARALLEL REVIEWER SWARM ==================== -->
  <g transform="translate(760, 95)" filter="url(#pShadow)">
    <rect width="220" height="260" rx="8" fill="url(#nodeDark)" stroke="#ff3300" stroke-width="1.5"/>
    <rect width="220" height="26" rx="8" fill="#1e1013"/>
    <rect y="16" width="220" height="10" fill="#1e1013"/>
    <text x="110" y="18" text-anchor="middle" font-size="9.5" font-weight="900" fill="#ff4d6a" class="mono">STAGE 04 // 28 REVIEWERS</text>

    <text x="110" y="50" text-anchor="middle" font-size="13.5" font-weight="900" fill="#f5f2eb" class="extended">Reviewer Swarm</text>
    <text x="110" y="65" text-anchor="middle" font-size="8.5" font-weight="800" fill="#ff3300" class="mono">ZERO-TRUST VERIFICATION</text>

    <!-- MarCardona 5 Reviewer Decal Strips with Shield Decomposition -->
    <g transform="translate(15, 78)">
      <!-- Strip 1: Logic (Solid Shield) -->
      <rect width="190" height="24" rx="3" fill="#0d1017" stroke="#252a3a" stroke-width="0.8"/>
      <path d="M 12 6 L 18 9 L 18 15 C 18 19, 15 22, 12 23 C 9 22, 6 19, 6 15 L 6 9 Z" fill="#ff3300"/>
      <text x="26" y="16" font-size="9.5" font-weight="700" fill="#f5f2eb" class="mono">logic-reviewer</text>
      <text x="180" y="16" text-anchor="end" font-size="9" fill="#8a92a3" class="mono">AST</text>

      <!-- Strip 2: Security (Halftone Shield) -->
      <g transform="translate(0, 28)">
        <rect width="190" height="24" rx="3" fill="#0d1017" stroke="#252a3a" stroke-width="0.8"/>
        <path d="M 12 6 L 18 9 L 18 15 C 18 19, 15 22, 12 23 C 9 22, 6 19, 6 15 L 6 9 Z" fill="url(#pipeDots)"/>
        <text x="26" y="16" font-size="9.5" font-weight="700" fill="#f5f2eb" class="mono">security-auditor</text>
        <text x="180" y="16" text-anchor="end" font-size="9" fill="#ff4d6a" class="mono">OWASP</text>
      </g>

      <!-- Strip 3: Precedence (Contour Shield) -->
      <g transform="translate(0, 56)">
        <rect width="190" height="24" rx="3" fill="#0d1017" stroke="#ff3300" stroke-width="0.8"/>
        <path d="M 12 6 L 18 9 L 18 15 C 18 19, 15 22, 12 23 C 9 22, 6 19, 6 15 L 6 9 Z" fill="none" stroke="#ff3300" stroke-width="1.2"/>
        <text x="26" y="16" font-size="9.5" font-weight="700" fill="#f5f2eb" class="mono">precedence-reviewer</text>
        <text x="180" y="16" text-anchor="end" font-size="9" fill="#ff3300" class="mono">CASES</text>
      </g>

      <!-- Strip 4: Schema (Stippled Shield) -->
      <g transform="translate(0, 84)">
        <rect width="190" height="24" rx="3" fill="#0d1017" stroke="#252a3a" stroke-width="0.8"/>
        <path d="M 12 6 L 18 9 L 18 15 C 18 19, 15 22, 12 23 C 9 22, 6 19, 6 15 L 6 9 Z" fill="none" stroke="#8a92a3" stroke-width="1" stroke-dasharray="2 2"/>
        <text x="26" y="16" font-size="9.5" font-weight="700" fill="#f5f2eb" class="mono">schema-reviewer</text>
        <text x="180" y="16" text-anchor="end" font-size="9" fill="#8a92a3" class="mono">SQL</text>
      </g>

      <!-- Strip 5: Resilience (Wireframe Shield) -->
      <g transform="translate(0, 112)">
        <rect width="190" height="24" rx="3" fill="#0d1017" stroke="#252a3a" stroke-width="0.8"/>
        <path d="M 12 6 L 18 9 L 18 15 C 18 19, 15 22, 12 23 C 9 22, 6 19, 6 15 L 6 9 Z" fill="none" stroke="#ff3300" stroke-width="0.8"/>
        <text x="26" y="16" font-size="9.5" font-weight="700" fill="#f5f2eb" class="mono">resilience-reviewer</text>
        <text x="180" y="16" text-anchor="end" font-size="9" fill="#8a92a3" class="mono">ASYNC</text>
      </g>
    </g>

    <rect x="25" y="228" width="170" height="20" rx="3" fill="#ff3300" fill-opacity="0.2"/>
    <text x="110" y="242" text-anchor="middle" font-size="9" font-weight="900" fill="#ff3300" class="mono">ALL 28 GATES MUST PASS</text>
  </g>

  <!-- ==================== STAGE 05: COMMIT TO DISK ==================== -->
  <g transform="translate(1040, 135)" filter="url(#pShadow)">
    <rect width="120" height="180" rx="8" fill="url(#nodePass)" stroke="#ff3300" stroke-width="1.5"/>
    <rect width="120" height="26" rx="8" fill="#142410"/>
    <rect y="16" width="120" height="10" fill="#142410"/>
    <text x="60" y="18" text-anchor="middle" font-size="9.5" font-weight="900" fill="#86efac" class="mono">STAGE 05</text>

    <!-- Keycap Seal [O][K] -->
    <g transform="translate(30, 42)">
      <rect width="28" height="28" rx="4" fill="#0c170d" stroke="#22c55e" stroke-width="1"/>
      <text x="14" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#86efac" class="mono">O</text>
      <rect x="32" y="0" width="28" height="28" rx="4" fill="#0c170d" stroke="#22c55e" stroke-width="1"/>
      <text x="46" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#86efac" class="mono">K</text>
    </g>

    <text x="60" y="92" text-anchor="middle" font-size="11.5" font-weight="900" fill="#f5f2eb" class="sans">Human Gate</text>
    <text x="60" y="106" text-anchor="middle" font-size="8.5" fill="#86efac" class="mono">Explicit Approval</text>
    <line x1="15" y1="116" x2="105" y2="116" stroke="#254d24" stroke-width="1"/>

    <text x="60" y="136" text-anchor="middle" font-size="10" font-weight="900" fill="#ff3300" class="mono">SAFE COMMIT</text>
    <text x="60" y="150" text-anchor="middle" font-size="8" fill="#f5f2eb" class="mono">Atomic Disk Write</text>

    <rect x="12" y="156" width="96" height="16" rx="2" fill="#ff3300" fill-opacity="0.2"/>
    <text x="60" y="168" text-anchor="middle" font-size="7.5" font-weight="900" fill="#ff3300" class="mono">100% SHIPPED</text>
  </g>
</svg>
