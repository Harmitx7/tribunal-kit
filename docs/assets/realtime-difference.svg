    <rect y="30" width="505" height="14" fill="#181c28"/>
    <line x1="0" y1="44" x2="505" y2="44" stroke="#ff3300" stroke-width="1.5"/>

    <!-- Setlife Kinetic Speed Slices on Top Header -->
    <rect x="18" y="20" width="30" height="4" rx="1" fill="url(#flameBar)"/>
    <rect x="52" y="20" width="16" height="4" rx="1" fill="url(#flameBar)"/>

    <!-- Right Header Title -->
    <text x="80" y="27" font-size="13" font-weight="900" fill="#f5f2eb" letter-spacing="1.5" class="extended">
      WITH TRIBUNAL KIT
    </text>

    <!-- Keycaps Status Badge [P] [A] [S] [S] -->
    <g transform="translate(365, 10)">
      <!-- Key P -->
      <rect x="0" y="0" width="24" height="24" rx="3" fill="#0d1017" stroke="#ff3300" stroke-width="0.8"/>
      <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#ff3300" class="mono">P</text>
      <!-- Key A -->
      <rect x="28" y="0" width="24" height="24" rx="3" fill="#0d1017" stroke="#ff3300" stroke-width="0.8"/>
      <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#ff3300" class="mono">A</text>
      <!-- Key S -->
      <rect x="56" y="0" width="24" height="24" rx="3" fill="#0d1017" stroke="#ff3300" stroke-width="0.8"/>
      <text x="68" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#ff3300" class="mono">S</text>
      <!-- Key S -->
      <rect x="84" y="0" width="24" height="24" rx="3" fill="#0d1017" stroke="#ff3300" stroke-width="0.8"/>
      <text x="96" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#ff3300" class="mono">S</text>
    </g>

    <!-- Terminal Prompt -->
    <text x="24" y="78" font-size="12" fill="#71717a" class="mono">$</text>
    <text x="40" y="78" font-size="12" font-weight="600" fill="#f4f4f5" class="mono">cursor "Build a file upload Server Action"</text>

    <!-- Intercept Telemetry Box -->
    <text x="24" y="112" font-size="10.5" font-weight="800" fill="#ff3300" letter-spacing="1" class="mono">
      TRIBUNAL CORE INTERCEPT // &lt;10ms:
    </text>
    <rect x="22" y="122" width="461" height="98" rx="4" fill="#0e131d" stroke="#2a334a" stroke-width="1.2"/>
    <text x="36" y="146" font-size="11" font-weight="700" fill="#ff4d6a" class="mono">
      🛡️ [BLOCKED: 9ms] 'ghost-s3-uploader' is a PHANTOM PACKAGE
    </text>
    <text x="36" y="170" font-size="11" font-weight="700" fill="#ff3300" class="mono">
      ⚖️ [CASE LAW] Enforcing Next.js 15 Server Action &amp; React 19 standard
    </text>
    <text x="36" y="194" font-size="11" font-weight="700" fill="#f5f2eb" class="mono">
      ✅ [APPROVED] Auto-corrected with active project dependencies
    </text>

    <!-- Governed Code Written Box -->
    <text x="24" y="244" font-size="10.5" font-weight="800" fill="#f5f2eb" letter-spacing="1" class="mono">
      GOVERNED AST WRITTEN TO DISK:
    </text>
    <rect x="22" y="254" width="461" height="74" rx="4" fill="#090b10" stroke="#ff3300" stroke-width="1" stroke-opacity="0.7"/>
    <text x="36" y="280" font-size="12" fill="#e4e4e7" class="mono">
      <tspan fill="#ff3300">import</tspan> { useActionState } <tspan fill="#ff3300">from</tspan> <tspan fill="#f5f2eb">'react'</tspan>;
    </text>
    <text x="36" y="306" font-size="12" fill="#e4e4e7" class="mono">
      <tspan fill="#ff3300">import</tspan> { put } <tspan fill="#ff3300">from</tspan> <tspan fill="#f5f2eb" font-weight="700">'@vercel/blob'</tspan>;
    </text>

    <!-- Reward Footer Decal -->
    <rect x="22" y="348" width="461" height="42" rx="4" fill="#1b120c" stroke="#ff3300" stroke-width="1.4"/>
    <text x="252" y="374" text-anchor="middle" font-size="12" font-weight="900" fill="#ff3300" letter-spacing="1" class="mono">
      ⚡ 0 MINUTES WASTED • 100% PRODUCTION READY
    </text>
  </g>
</svg>
