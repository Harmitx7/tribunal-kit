        <rect x="2" y="2" width="24" height="24" rx="3" fill="#1c0a0c" stroke="#3d161d" stroke-width="1"/>
        <path d="M 2 2 L 26 2 L 24 5 L 4 5 Z" class="keycap-highlight" />
        <path d="M 2 26 L 26 26 L 24 23 L 4 23 Z" class="keycap-shadow" />
        <text x="14" y="18" fill="#ff3300" font-weight="bold" text-anchor="middle" font-size="12" class="mono-text">S</text>
