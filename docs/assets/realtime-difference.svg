<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>

    <!-- Left Box Gradient -->
    <linearGradient id="unprotectedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140a0d"/>
      <stop offset="100%" stop-color="#0c0608"/>
    </linearGradient>

    <!-- Right Box Gradient -->
    <linearGradient id="governedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11141d"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <linearGradient id="flameBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff3300" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ff3300" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="diffShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="alarmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#222634" opacity="0.4" />
    </pattern>

    <clipPath id="telemetryClip">
      <rect x="22" y="124" width="461" height="98" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .title-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; letter-spacing: 1px; }
    .mono-text { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; letter-spacing: 0.5px; }
    
    .keycap-highlight { fill: #ffffff; opacity: 0.08; }
    .keycap-shadow { fill: #000000; opacity: 0.3; }

    /* Blinking Terminal Cursors */
    .term-cursor-left {
      animation: cursorBlink 1s step-end infinite;
    }
    .term-cursor-right {
      animation: cursorBlink 1s step-end infinite 0.5s;
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Left Box Crash Alarm Pulse */
    .crash-alarm-box {
      animation: crashPulse 2.4s ease-in-out infinite;
    }
    @keyframes crashPulse {
      0%, 100% {
        stroke: #ff3300;
        stroke-opacity: 0.8;
        filter: drop-shadow(0 0 3px rgba(255,51,0,0.3));
      }
      50% {
        stroke: #f43f5e;
        stroke-opacity: 1;
        filter: drop-shadow(0 0 10px rgba(244,63,94,0.6));
      }
    }

    /* Right Box Active Telemetry Sweep Beam */
    .telemetry-sweep {
      animation: sweepTelemetry 2.8s ease-in-out infinite;
    }
    @keyframes sweepTelemetry {
      0%, 100% { transform: translateY(0px); opacity: 0.7; }
      50% { transform: translateY(94px); opacity: 1; }
    }

    /* Right Box Governed AST Written Glow */
    .ast-governed-box {
      animation: astGlow 3.2s ease-in-out infinite;
    }
    @keyframes astGlow {
      0%, 100% {
        stroke: #ff3300;
        stroke-opacity: 0.6;
        filter: drop-shadow(0 0 2px rgba(255,51,0,0.2));
      }
      50% {
        stroke: #00ff66;
        stroke-opacity: 0.9;
        filter: drop-shadow(0 0 8px rgba(0,255,102,0.4));
      }
    }

    /* Pulsing Alert Diodes */
    .alert-diode {
      animation: alertBlink 1.4s ease-in-out infinite;
    }
    @keyframes alertBlink {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.85); }
    }

    .verified-diode {
      animation: verifiedBlink 2s ease-in-out infinite;
    }
    @keyframes verifiedBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Accessibility Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .term-cursor-left, .term-cursor-right, .crash-alarm-box, .telemetry-sweep, .ast-governed-box, .alert-diode, .verified-diode {
        animation: none !important;
        transform: none !important;
        filter: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Background Base -->
  <rect width="1100" height="460" fill="url(#diffBg)"/>
  <rect width="1100" height="460" fill="url(#cardGrid)"/>
  <rect width="1098" height="458" x="1" y="1" rx="4" fill="none" stroke="#222634" stroke-width="1.2"/>

  <!-- ==================== LEFT PANE: WITHOUT TRIBUNAL (UNPROTECTED) ==================== -->
  <g transform="translate(30, 25)" filter="url(#diffShadow)">
    <rect width="505" height="410" rx="8" fill="url(#unprotectedBg)"/>
    <rect width="505" height="410" rx="8" fill="none" stroke="#4a1820" stroke-width="1.5"/>

    <!-- Hazard Top Tape Decal -->
    <rect width="505" height="44" rx="8" fill="#240c12"/>
    <rect y="30" width="505" height="14" fill="#240c12"/>
    <line x1="0" y1="44" x2="505" y2="44" stroke="#ff3300" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Hazard Diagonal Stripes -->
    <path d="M 12 0 L 22 0 L 10 44 L 0 44 Z" fill="#ff3300" fill-opacity="0.3"/>
    <path d="M 32 0 L 42 0 L 30 44 L 20 44 Z" fill="#ff3300" fill-opacity="0.3"/>
    <path d="M 52 0 L 62 0 L 50 44 L 40 44 Z" fill="#ff3300" fill-opacity="0.3"/>

    <!-- Left Header Title -->
    <text x="80" y="27" font-size="14" fill="#fca5a5" class="title-text">WITHOUT TRIBUNAL KIT</text>
    
    <rect x="375" y="12" width="115" height="20" rx="3" fill="#ff3300" fill-opacity="0.2" stroke="#ff3300" stroke-width="0.8"/>
    <circle cx="385" cy="22" r="3" fill="#ff3300" class="alert-diode"/>
    <text x="435" y="26" text-anchor="middle" font-size="9" font-weight="900" fill="#ff4d1a" class="mono-text">UNGOVERNED AI</text>

    <!-- Terminal Prompt with Blinking Cursor -->
    <text x="24" y="80" font-size="12" fill="#71717a" class="mono-text">$</text>
    <text x="40" y="80" font-size="12" font-weight="600" fill="#f4f4f5" class="mono-text">cursor "Build a file upload Server Action"</text>
    <rect x="378" y="68" width="7" height="14" fill="#f43f5e" class="term-cursor-left"/>

    <!-- Raw AI Output Box -->
    <text x="24" y="114" font-size="10" font-weight="800" fill="#9ca3af" class="mono-text">RAW AI OUTPUT // HALLUCINATED:</text>
    <rect x="22" y="124" width="461" height="74" rx="4" fill="#12080b" stroke="#3d161d" stroke-width="1"/>
    <text x="36" y="150" font-size="12" fill="#e4e4e7" class="mono-text">
      <tspan fill="#f43f5e">import</tspan> { useFormStatus } <tspan fill="#f43f5e">from</tspan> <tspan fill="#fb7185">'react-dom'</tspan>;
    </text>
    <text x="36" y="176" font-size="12" fill="#e4e4e7" class="mono-text">
      <tspan fill="#f43f5e">import</tspan> { uploadFile } <tspan fill="#f43f5e">from</tspan> <tspan fill="#ff3300" font-weight="700" text-decoration="underline">'ghost-s3-uploader'</tspan>;
    </text>

    <!-- Crash Trace Box with Alarm Glow -->
    <text x="24" y="224" font-size="10" font-weight="800" fill="#ff4d1a" class="mono-text">TERMINAL CRASH TRACE:</text>
    <rect x="22" y="234" width="461" height="98" rx="4" fill="#260c14" stroke="#ff3300" stroke-width="1.2" class="crash-alarm-box"/>
    <text x="36" y="260" font-size="11" font-weight="700" fill="#ff4d1a" class="mono-text">
      ❌ ModuleNotFoundError: Cannot find 'ghost-s3-uploader'
    </text>
    <text x="36" y="284" font-size="11" fill="#fca5a5" class="mono-text">
      ⚠️ DeprecatedHookWarning: useFormStatus deprecated in React 19
    </text>
    <text x="36" y="308" font-size="11" fill="#fda4af" class="mono-text">
      👉 Vector: Slopsquatting / AI fabricated phantom package
    </text>

    <!-- Penalty Footer Decal -->
    <rect x="22" y="350" width="461" height="42" rx="4" fill="#1a0a0e" stroke="#5c1926" stroke-width="1"/>
    <text x="252" y="376" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3355" class="mono-text">
      💥 45+ MINUTES WASTED DEBUGGING GHOST CODE
    </text>
  </g>

  <!-- ==================== RIGHT PANE: WITH TRIBUNAL (GOVERNED) ==================== -->
  <g transform="translate(565, 25)" filter="url(#diffShadow)">
    <rect width="505" height="410" rx="8" fill="url(#governedBg)"/>
    <rect width="505" height="410" rx="8" fill="none" stroke="#ff3300" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Top Tape Decal -->
    <rect width="505" height="44" rx="8" fill="#131620"/>
    <rect y="30" width="505" height="14" fill="#131620"/>
    <line x1="0" y1="44" x2="505" y2="44" stroke="#ff3300" stroke-width="1.5"/>

    <!-- Flame Kinetic Speed Slices -->
    <rect x="20" y="20" width="30" height="4" rx="1" fill="url(#flameBar)"/>
    <rect x="54" y="20" width="16" height="4" rx="1" fill="url(#flameBar)"/>

    <!-- Right Header Title -->
    <text x="82" y="27" font-size="14" fill="#f5f2eb" class="title-text">WITH TRIBUNAL KIT</text>

    <!-- 3D Keycaps Status Badge [P] [A] [S] [S] -->
    <g transform="translate(365, 8)">
      <!-- P -->
      <g transform="translate(0, 0)">
        <rect width="28" height="28" rx="4" fill="#0e1117" stroke="#ff3300" stroke-width="0.8"/>
        <rect x="2" y="2" width="24" height="24" rx="3" fill="#1c0a0c" stroke="#3d161d" stroke-width="1"/>
        <path d="M 2 2 L 26 2 L 24 5 L 4 5 Z" class="keycap-highlight" />
        <path d="M 2 26 L 26 26 L 24 23 L 4 23 Z" class="keycap-shadow" />
        <text x="14" y="18" fill="#ff3300" font-weight="bold" text-anchor="middle" font-size="12" class="mono-text">P</text>
      </g>
      <!-- A -->
      <g transform="translate(32, 0)">
        <rect width="28" height="28" rx="4" fill="#0e1117" stroke="#ff3300" stroke-width="0.8"/>
        <rect x="2" y="2" width="24" height="24" rx="3" fill="#1c0a0c" stroke="#3d161d" stroke-width="1"/>
        <path d="M 2 2 L 26 2 L 24 5 L 4 5 Z" class="keycap-highlight" />
        <path d="M 2 26 L 26 26 L 24 23 L 4 23 Z" class="keycap-shadow" />
        <text x="14" y="18" fill="#ff3300" font-weight="bold" text-anchor="middle" font-size="12" class="mono-text">A</text>
      </g>
      <!-- S -->
      <g transform="translate(64, 0)">
        <rect width="28" height="28" rx="4" fill="#0e1117" stroke="#ff3300" stroke-width="0.8"/>
        <rect x="2" y="2" width="24" height="24" rx="3" fill="#1c0a0c" stroke="#3d161d" stroke-width="1"/>
        <path d="M 2 2 L 26 2 L 24 5 L 4 5 Z" class="keycap-highlight" />
        <path d="M 2 26 L 26 26 L 24 23 L 4 23 Z" class="keycap-shadow" />
        <text x="14" y="18" fill="#ff3300" font-weight="bold" text-anchor="middle" font-size="12" class="mono-text">S</text>
      </g>
      <!-- S -->
      <g transform="translate(96, 0)">
        <rect width="28" height="28" rx="4" fill="#0e1117" stroke="#ff3300" stroke-width="0.8"/>
        <rect x="2" y="2" width="24" height="24" rx="3" fill="#1c0a0c" stroke="#3d161d" stroke-width="1"/>
        <path d="M 2 2 L 26 2 L 24 5 L 4 5 Z" class="keycap-highlight" />
        <path d="M 2 26 L 26 26 L 24 23 L 4 23 Z" class="keycap-shadow" />
        <text x="14" y="18" fill="#ff3300" font-weight="bold" text-anchor="middle" font-size="12" class="mono-text">S</text>
      </g>
    </g>

    <!-- Terminal Prompt with Blinking Cursor -->
    <text x="24" y="80" font-size="12" fill="#71717a" class="mono-text">$</text>
    <text x="40" y="80" font-size="12" font-weight="600" fill="#f4f4f5" class="mono-text">cursor "Build a file upload Server Action"</text>
    <rect x="378" y="68" width="7" height="14" fill="#00ff66" class="term-cursor-right"/>

    <!-- Intercept Telemetry Box with Active Scan Beam -->
    <text x="24" y="114" font-size="10" font-weight="800" fill="#ff3300" class="mono-text">TRIBUNAL CORE INTERCEPT // &lt;10ms:</text>
    <g clip-path="url(#telemetryClip)">
      <rect x="22" y="124" width="461" height="98" rx="4" fill="#0e131d" stroke="#222634" stroke-width="1"/>
      <!-- Active Laser Sweep Line -->
      <g class="telemetry-sweep">
        <line x1="22" y1="124" x2="483" y2="124" stroke="url(#scanBeam)" stroke-width="2" filter="url(#alarmGlow)"/>
      </g>
      <text x="36" y="148" font-size="11" font-weight="700" fill="#ff4d1a" class="mono-text">
        🛡️ [BLOCKED: 9ms] 'ghost-s3-uploader' is a PHANTOM PACKAGE
      </text>
      <text x="36" y="172" font-size="11" font-weight="700" fill="#ff3300" class="mono-text">
        ⚖️ [CASE LAW] Enforcing Next.js 15 Server Action &amp; React 19 standard
      </text>
      <text x="36" y="196" font-size="11" font-weight="700" fill="#f5f2eb" class="mono-text">
        ✅ [APPROVED] Auto-corrected with active project dependencies
      </text>
    </g>

    <!-- Governed Code Written Box with Verified Ast Glow -->
    <text x="24" y="246" font-size="10" font-weight="800" fill="#f5f2eb" class="mono-text">GOVERNED AST WRITTEN TO DISK:</text>
    <rect x="22" y="256" width="461" height="74" rx="4" fill="#090b10" stroke="#ff3300" stroke-width="1.2" class="ast-governed-box"/>
    <text x="36" y="282" font-size="12" fill="#e4e4e7" class="mono-text">
      <tspan fill="#ff3300">import</tspan> { useActionState } <tspan fill="#ff3300">from</tspan> <tspan fill="#f5f2eb">'react'</tspan>;
    </text>
    <text x="36" y="308" font-size="12" fill="#e4e4e7" class="mono-text">
      <tspan fill="#ff3300">import</tspan> { put } <tspan fill="#ff3300">from</tspan> <tspan fill="#f5f2eb" font-weight="700">'@vercel/blob'</tspan>;
    </text>

    <!-- Reward Footer Decal with Verified Diode -->
    <rect x="22" y="350" width="461" height="42" rx="4" fill="#1b120c" stroke="#ff3300" stroke-width="1.4"/>
    <circle cx="42" cy="371" r="3" fill="#00ff66" class="verified-diode"/>
    <circle cx="463" cy="371" r="3" fill="#00ff66" class="verified-diode"/>
    <text x="252" y="376" text-anchor="middle" font-size="12" font-weight="900" fill="#ff3300" class="mono-text">
      ⚡ 0 MINUTES WASTED • 100% PRODUCTION READY
    </text>
  </g>
</svg>
