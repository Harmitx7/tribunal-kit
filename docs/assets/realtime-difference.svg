<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Left Box Gradient -->
    <linearGradient id="unprotectedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140a0d"/>
      <stop offset="100%" stop-color="#0c0608"/>
    </linearGradient>

    <!-- Right Box Gradient -->
    <linearGradient id="governedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11141d"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <linearGradient id="flameBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Halftone for comparison -->
    <pattern id="dotPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#ff3300" fill-opacity="0.3"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="diffShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161924" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .extended { font-family: -apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1100" height="460" rx="16" fill="url(#diffBg)"/>
  <rect width="1100" height="460" rx="16" fill="url(#cardGrid)"/>
  <rect width="1098" height="458" x="1" y="1" rx="15" fill="none" stroke="#222634" stroke-width="1.2"/>

  <!-- ==================== LEFT PANE: WITHOUT TRIBUNAL (UNPROTECTED) ==================== -->
  <g transform="translate(30, 25)" filter="url(#diffShadow)">
    <rect width="505" height="410" rx="10" fill="url(#unprotectedBg)"/>
    <rect width="505" height="410" rx="10" fill="none" stroke="#4a1820" stroke-width="1.5"/>

    <!-- Hazard Top Tape Decal -->
    <rect width="505" height="44" rx="10" fill="#240c12"/>
    <rect y="30" width="505" height="14" fill="#240c12"/>
    <line x1="0" y1="44" x2="505" y2="44" stroke="#ff2200" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Hazard Diagonal Stripes -->
    <path d="M 12 0 L 22 0 L 10 44 L 0 44 Z" fill="#ff2200" fill-opacity="0.3"/>
    <path d="M 32 0 L 42 0 L 30 44 L 20 44 Z" fill="#ff2200" fill-opacity="0.3"/>
    <path d="M 52 0 L 62 0 L 50 44 L 40 44 Z" fill="#ff2200" fill-opacity="0.3"/>

    <!-- Left Header Title -->
    <text x="75" y="27" font-size="13" font-weight="900" fill="#fca5a5" letter-spacing="1.5" class="extended">
      WITHOUT TRIBUNAL KIT
    </text>
    <rect x="375" y="12" width="115" height="20" rx="3" fill="#ff2200" fill-opacity="0.25" stroke="#ff2200" stroke-width="0.8"/>
    <text x="432" y="26" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ff4d6a" class="mono">
      UNGOVERNED AI
    </text>

    <!-- Terminal Prompt -->
    <text x="24" y="78" font-size="12" fill="#71717a" class="mono">$</text>
    <text x="40" y="78" font-size="12" font-weight="600" fill="#f4f4f5" class="mono">cursor "Build a file upload Server Action"</text>

    <!-- Raw AI Output Box -->
    <text x="24" y="112" font-size="10.5" font-weight="800" fill="#9ca3af" letter-spacing="1" class="mono">
      RAW AI OUTPUT // HALLUCINATED:
    </text>
    <rect x="22" y="122" width="461" height="74" rx="4" fill="#12080b" stroke="#3d161d" stroke-width="1"/>
    <text x="36" y="148" font-size="12" fill="#e4e4e7" class="mono">
      <tspan fill="#f43f5e">import</tspan> { useFormStatus } <tspan fill="#f43f5e">from</tspan> <tspan fill="#fb7185">'react-dom'</tspan>;
    </text>
    <text x="36" y="174" font-size="12" fill="#e4e4e7" class="mono">
      <tspan fill="#f43f5e">import</tspan> { uploadFile } <tspan fill="#f43f5e">from</tspan> <tspan fill="#ff2200" font-weight="700" text-decoration="underline">'ghost-s3-uploader'</tspan>;
    </text>

    <!-- Crash Trace Box -->
    <text x="24" y="222" font-size="10.5" font-weight="800" fill="#ff4d6a" letter-spacing="1" class="mono">
      TERMINAL CRASH TRACE:
    </text>
    <rect x="22" y="232" width="461" height="98" rx="4" fill="#260c14" stroke="#ff2200" stroke-width="1.2"/>
    <text x="36" y="258" font-size="11.5" font-weight="700" fill="#ff4d6a" class="mono">
      ❌ ModuleNotFoundError: Cannot find 'ghost-s3-uploader'
    </text>
    <text x="36" y="282" font-size="11" fill="#fca5a5" class="mono">
      ⚠️  DeprecatedHookWarning: useFormStatus deprecated in React 19
    </text>
    <text x="36" y="306" font-size="11" fill="#fda4af" class="mono">
      👉 Vector: Slopsquatting / AI fabricated phantom package
    </text>

    <!-- Penalty Footer Decal -->
    <rect x="22" y="348" width="461" height="42" rx="4" fill="#1a0a0e" stroke="#5c1926" stroke-width="1"/>
    <text x="252" y="374" text-anchor="middle" font-size="12" font-weight="800" fill="#ff3355" letter-spacing="1" class="mono">
      💥 45+ MINUTES WASTED DEBUGGING GHOST CODE
    </text>
  </g>

  <!-- ==================== RIGHT PANE: WITH TRIBUNAL (GOVERNED) ==================== -->
  <g transform="translate(565, 25)" filter="url(#diffShadow)">
    <rect width="505" height="410" rx="10" fill="url(#governedBg)"/>
    <rect width="505" height="410" rx="10" fill="none" stroke="#ff3300" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Top Tape Decal with Setlife Flame Accent -->
