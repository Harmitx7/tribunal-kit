name: Feature Request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Tribunal Kit better? We'd love to hear it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tribunal Kit does this affect?
      options:
        - CLI Commands
        - Agents (`.agent/agents/`)
        - Skills (`.agent/skills/`)
        - Workflows (`.agent/workflows/`)
        - Rust Core
        - MCP Server
        - Memory System
        - Case Law
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? Describe the use case, not just the solution.
      placeholder: "When I use Cursor with a large monorepo, I need..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: dropdown
    id: willing
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes — I'd like to submit a PR"
        - "Maybe — with guidance"
        - "No — just suggesting"
