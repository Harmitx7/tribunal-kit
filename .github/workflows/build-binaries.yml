name: Build & Release Rust Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tribunal-core-win-x64.exe
            binary: tribunal-core.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: tribunal-core-win-arm64.exe
            binary: tribunal-core.exe
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: tribunal-core-darwin-x64
            binary: tribunal-core
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: tribunal-core-darwin-arm64
            binary: tribunal-core
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tribunal-core-linux-x64
            binary: tribunal-core
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tribunal-core-linux-arm64
            binary: tribunal-core

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          merge-multiple: true

      - name: Package Platform NPM Tarballs
        run: |
          node scripts/package-cores.js --pack

      - name: Generate Checksums
        run: sha256sum tribunal-core-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            tribunal-core-win-x64.exe
            tribunal-core-win-arm64.exe
            tribunal-core-darwin-x64
            tribunal-core-darwin-arm64
            tribunal-core-linux-x64
            tribunal-core-linux-arm64
            checksums.txt
            npm/packages/**/*.tgz
          generate_release_notes: true
